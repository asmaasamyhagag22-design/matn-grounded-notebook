name: Offline fast checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Rendering and JavaScript dependencies
        run: sudo apt-get update && sudo apt-get install -y libreoffice-impress fonts-crosextra-carlito fonts-noto-core fonts-liberation nodejs
      - run: python -m pip install -r requirements-ci.txt
      - name: Deterministic tests (no model weights or searches)
        run: bash scripts/ci-fast.sh
